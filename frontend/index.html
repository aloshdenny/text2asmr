<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Community soundboard to help train the asmr-m1-preview model" />
    <meta property="og:title" content="ASMR Board" />
    <meta property="og:description" content="Community soundboard to help train the asmr-m1-preview model" />
    <title>ASMR Board</title>
    <!-- Dark unless the visitor chose light with the toggle; stamped before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('asmrboard-theme') === 'light' ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
