<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ASMR Board: label short ASMR clips and help train the open text2asmr sound classifier." />
    <title>ASMR Board</title>
    <!-- Light unless the visitor chose dark with the toggle; stamped before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('asmrboard-theme') === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
